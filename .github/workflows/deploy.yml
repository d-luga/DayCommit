name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 91.134.75.58
  DEPLOY_USER: deploy
  SITE_URL: https://daycommit.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/daycommit-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://daycommit.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file
        run: scp deploy/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:/srv/daycommit/compose.yaml"

      - name: Log the server in to GHCR for this deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull and restart
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "WEB_IMAGE='${{ needs.build.outputs.image }}' bash -s" < deploy/remote-deploy.sh

      - name: Check the new version is live
        run: |
          for i in $(seq 1 10); do
            live="$(curl -fsS "$SITE_URL/version.txt" || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $live"
              exit 0
            fi
            echo "Attempt $i: live version is '$live', waiting..."
            sleep 3
          done
          echo "Deployed version did not go live" >&2
          exit 1
